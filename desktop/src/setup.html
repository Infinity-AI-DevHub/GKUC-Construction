<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GKUC Construction connection</title><style>
body{margin:0;background:#102a43;font:16px system-ui;color:#17324d;display:grid;min-height:100vh;place-items:center}main{background:white;border-radius:18px;padding:36px;width:min(480px,80vw)}h1{margin-top:0}label{display:grid;gap:10px;font-weight:650}input,button{font:inherit;padding:12px;border-radius:8px;border:1px solid #cad5df}button{margin-top:20px;background:#a7193f;color:white;border:0;cursor:pointer}p{line-height:1.6}#error{color:#a7193f}
</style></head><body><main><h1>Connect to GKUC Construction</h1><p>Use the same secure server as the browser app. An internet connection is required. This desktop client does not store a separate payroll database.</p><form><label>Server address<input name="server" type="url" required placeholder="https://staff.gkucconstruction.com"></label><p>Changing the server signs you out. The app restarts after saving.</p><p id="error" role="alert"></p><button>Save and restart</button></form></main><script>
siteopsDesktop.connection().then(value=>document.querySelector('input').value=value.serverUrl||'');
document.querySelector('form').addEventListener('submit',async event=>{event.preventDefault();const button=document.querySelector('button');button.disabled=true;try{await siteopsDesktop.saveConnection(document.querySelector('input').value);}catch{document.querySelector('#error').textContent='Enter a valid HTTPS server address and try again.';button.disabled=false;}});
</script></body></html>
